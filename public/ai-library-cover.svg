<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="大雷 AI 方案库版式示意，非实时数据 / AI Solutions Library layout illustration, not live data">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9f8fa"/>
      <stop offset="1" stop-color="#cfeef2"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#2497a5" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#2497a5" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="750" fill="url(#bg)"/>
  <ellipse cx="640" cy="330" rx="520" ry="380" fill="url(#glow)"/>

  <!-- heading -->
  <text x="80" y="108" font-family="'Cormorant Garamond', Georgia, serif" font-size="58" font-weight="600" fill="#14353b">大雷 AI 方案库</text>
  <text x="82" y="156" font-family="'JetBrains Mono', monospace" font-size="20" fill="#147f8d">Free to browse · filter by role and use case</text>
  <text x="82" y="186" font-family="'JetBrains Mono', monospace" font-size="16" fill="#355e64">字段与版式示意 · 卡片不是实时条目</text>

  <!-- gallery of solution cards -->
  <g font-family="'JetBrains Mono', monospace">
    <!-- card template repeated; each: panel + title bar + tag chips -->
    <!-- row 1 -->
    <g filter="url(#soft)"><rect x="80" y="210" width="320" height="220" rx="14" fill="#f8feff" stroke="rgba(20,53,59,0.14)"/></g>
    <rect x="104" y="234" width="150" height="14" rx="7" fill="rgba(20,53,59,0.78)"/>
    <rect x="104" y="262" width="220" height="9" rx="4.5" fill="rgba(20,53,59,0.22)"/>
    <rect x="104" y="280" width="180" height="9" rx="4.5" fill="rgba(20,53,59,0.18)"/>
    <g font-size="13">
      <g><rect x="104" y="318" width="84" height="26" rx="13" fill="#2497a5" fill-opacity="0.14"/><text x="146" y="336" text-anchor="middle" fill="#147f8d">AI Agent</text></g>
      <g><rect x="198" y="318" width="64" height="26" rx="13" fill="rgba(20,53,59,0.07)"/><text x="230" y="336" text-anchor="middle" fill="rgba(20,53,59,0.72)">开源</text></g>
    </g>
    <g font-size="12"><text x="104" y="400" fill="rgba(20,53,59,0.56)">字段示意：场景 · 适合岗位</text></g>

    <g filter="url(#soft)"><rect x="440" y="210" width="320" height="220" rx="14" fill="#f8feff" stroke="rgba(20,53,59,0.14)"/></g>
    <rect x="464" y="234" width="120" height="14" rx="7" fill="rgba(20,53,59,0.78)"/>
    <rect x="464" y="262" width="220" height="9" rx="4.5" fill="rgba(20,53,59,0.22)"/>
    <rect x="464" y="280" width="160" height="9" rx="4.5" fill="rgba(20,53,59,0.18)"/>
    <g font-size="13">
      <g><rect x="464" y="318" width="52" height="26" rx="13" fill="#2497a5" fill-opacity="0.14"/><text x="490" y="336" text-anchor="middle" fill="#147f8d">RAG</text></g>
      <g><rect x="526" y="318" width="64" height="26" rx="13" fill="rgba(20,53,59,0.07)"/><text x="558" y="336" text-anchor="middle" fill="rgba(20,53,59,0.72)">免费</text></g>
    </g>
    <g font-size="12"><text x="464" y="400" fill="rgba(20,53,59,0.56)">字段示意：证据等级 · 是否亲测</text></g>

    <g filter="url(#soft)"><rect x="800" y="210" width="320" height="220" rx="14" fill="#f8feff" stroke="rgba(20,53,59,0.14)"/></g>
    <rect x="824" y="234" width="160" height="14" rx="7" fill="rgba(20,53,59,0.78)"/>
    <rect x="824" y="262" width="220" height="9" rx="4.5" fill="rgba(20,53,59,0.22)"/>
    <rect x="824" y="280" width="140" height="9" rx="4.5" fill="rgba(20,53,59,0.18)"/>
    <g font-size="13">
      <g><rect x="824" y="318" width="48" height="26" rx="13" fill="#2497a5" fill-opacity="0.14"/><text x="848" y="336" text-anchor="middle" fill="#147f8d">MCP</text></g>
      <g><rect x="882" y="318" width="96" height="26" rx="13" fill="rgba(20,53,59,0.07)"/><text x="930" y="336" text-anchor="middle" fill="rgba(20,53,59,0.72)">Deep Research</text></g>
    </g>
    <g font-size="12"><text x="824" y="400" fill="rgba(20,53,59,0.56)">字段示意：成本 · 风险提示</text></g>
  </g>

  <!-- view tabs -->
  <g font-family="'JetBrains Mono', monospace" font-size="15" fill="rgba(20,53,59,0.68)">
    <text x="80" y="500">Gallery</text>
    <text x="190" y="500">Table</text>
    <text x="290" y="500">Board · 行业</text>
    <text x="470" y="500">Calendar · AI 日报</text>
  </g>
  <line x1="80" y1="516" x2="1120" y2="516" stroke="rgba(20,53,59,0.14)"/>

  <!-- footer caption -->
  <text x="80" y="690" font-family="'JetBrains Mono', monospace" font-size="17" fill="#14353b" fill-opacity="0.72">字段与版式示意，不代表实时条目。请以 Notion 方案库为准。</text>
</svg>
