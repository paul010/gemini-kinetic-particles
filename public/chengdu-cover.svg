<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="Chengdu field guide — panda, gaiwan tea, hotpot, anchored on Taikoo Li">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6f3ec"/><stop offset="1" stop-color="#ece6da"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.35" r="0.65"><stop offset="0" stop-color="#8a682c" stop-opacity="0.13"/><stop offset="1" stop-color="#8a682c" stop-opacity="0"/></radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>
  <ellipse cx="600" cy="320" rx="540" ry="360" fill="url(#glow)"/>

  <text x="80" y="104" font-family="'Cormorant Garamond', Georgia, serif" font-size="56" font-weight="600" fill="#1c1a17">成都指南</text>
  <text x="82" y="150" font-family="'JetBrains Mono', monospace" font-size="19" fill="#8a682c">以太古里为原点 · 七月出差版 · 行前清单 + 特色速查</text>

  <!-- panda -->
  <g filter="url(#soft)">
    <circle cx="270" cy="400" r="110" fill="#fffdf8" stroke="rgba(28,26,23,0.12)"/>
    <circle cx="200" cy="316" r="34" fill="#1c1a17"/>
    <circle cx="340" cy="316" r="34" fill="#1c1a17"/>
    <ellipse cx="232" cy="388" rx="30" ry="38" fill="#1c1a17" transform="rotate(-18 232 388)"/>
    <ellipse cx="308" cy="388" rx="30" ry="38" fill="#1c1a17" transform="rotate(18 308 388)"/>
    <circle cx="240" cy="396" r="10" fill="#fffdf8"/>
    <circle cx="300" cy="396" r="10" fill="#fffdf8"/>
    <ellipse cx="270" cy="446" rx="16" ry="11" fill="#1c1a17"/>
    <path d="M254 470 q16 12 32 0" stroke="#1c1a17" stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- gaiwan tea bowl -->
  <g filter="url(#soft)">
    <path d="M520 430 q0 56 70 56 q70 0 70 -56 z" fill="#fffdf8" stroke="rgba(28,26,23,0.18)" stroke-width="2"/>
    <ellipse cx="590" cy="430" rx="70" ry="14" fill="#ece6da" stroke="rgba(28,26,23,0.18)" stroke-width="2"/>
    <ellipse cx="590" cy="404" rx="56" ry="12" fill="#fffdf8" stroke="rgba(28,26,23,0.18)" stroke-width="2"/>
    <circle cx="590" cy="398" r="9" fill="#8a682c"/>
    <ellipse cx="590" cy="496" rx="84" ry="10" fill="#ece6da" stroke="rgba(28,26,23,0.15)" stroke-width="2"/>
    <path d="M560 360 q4 -14 -4 -24 M590 356 q4 -14 -4 -24 M620 360 q4 -14 -4 -24" stroke="rgba(138,104,44,0.5)" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>

  <!-- hotpot -->
  <g filter="url(#soft)">
    <path d="M810 400 q0 74 100 74 q100 0 100 -74 z" fill="#1c1a17"/>
    <ellipse cx="910" cy="400" rx="100" ry="20" fill="#2a2723"/>
    <path d="M910 384 a 84 14 0 0 1 84 14 l -84 0 z" fill="#b03a3a"/>
    <path d="M826 398 a 84 14 0 0 1 84 -14 l 0 14 z" fill="#e8e0d0"/>
    <line x1="910" y1="384" x2="910" y2="414" stroke="#1c1a17" stroke-width="5"/>
    <circle cx="950" cy="394" r="6" fill="#e25c45"/>
    <circle cx="972" cy="398" r="5" fill="#e25c45"/>
    <circle cx="870" cy="394" r="5" fill="#fffdf8"/>
    <path d="M860 350 q6 -16 -2 -28 M910 344 q6 -16 -2 -28 M958 350 q6 -16 -2 -28" stroke="rgba(28,26,23,0.3)" stroke-width="4" fill="none" stroke-linecap="round"/>
    <ellipse cx="910" cy="482" rx="112" ry="10" fill="#ece6da" stroke="rgba(28,26,23,0.15)" stroke-width="2"/>
  </g>

  <!-- checklist strip -->
  <g font-family="'JetBrains Mono', monospace" font-size="15">
    <g filter="url(#soft)"><rect x="80" y="556" width="1040" height="52" rx="12" fill="#fffdf8" stroke="rgba(138,104,44,0.4)"/></g>
    <rect x="100" y="572" width="20" height="20" rx="5" fill="#8a682c"/>
    <path d="M104 582 l6 6 l10 -12" stroke="#f6f3ec" stroke-width="3" fill="none" stroke-linecap="round"/>
    <text x="134" y="587" fill="#1c1a17">D-14 抢熊猫基地上午票</text>
    <rect x="430" y="572" width="20" height="20" rx="5" fill="none" stroke="rgba(28,26,23,0.3)" stroke-width="2"/>
    <text x="464" y="587" fill="rgba(28,26,23,0.6)">D-7 订变脸演出</text>
    <rect x="690" y="572" width="20" height="20" rx="5" fill="none" stroke="rgba(28,26,23,0.3)" stroke-width="2"/>
    <text x="724" y="587" fill="rgba(28,26,23,0.6)">D-1 伞 · 防晒 · 肠胃药</text>
  </g>

  <text x="80" y="668" font-family="'Cormorant Garamond', Georgia, serif" font-size="28" font-weight="600" fill="#1c1a17">四个晚上,偷一个上午 —— 巴适得板</text>
  <text x="80" y="706" font-family="'JetBrains Mono', monospace" font-size="14" fill="#1c1a17" fill-opacity="0.45">吃 · 喝 · 看 · 说 —— 勾选状态存在浏览器,离出发越近钩越多</text>
</svg>
