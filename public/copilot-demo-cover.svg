<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Copilot 三段故事演示</title>
  <desc id="desc">从任务说清、事实查准，到方法复用的暖色编辑风路径图。</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f7f3e9" />
      <stop offset="1" stop-color="#eae2d2" />
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#765726" />
      <stop offset="0.5" stop-color="#b08a49" />
      <stop offset="1" stop-color="#765726" />
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#2b251d" flood-opacity="0.13" />
    </filter>
    <pattern id="grain" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="7" r="0.7" fill="#2b251d" opacity="0.08" />
      <circle cx="22" cy="18" r="0.6" fill="#2b251d" opacity="0.06" />
      <circle cx="13" cy="28" r="0.5" fill="#8a682c" opacity="0.08" />
    </pattern>
  </defs>
  <rect width="1200" height="675" fill="url(#paper)" />
  <rect width="1200" height="675" fill="url(#grain)" />
  <circle cx="1060" cy="90" r="220" fill="#b08a49" opacity="0.07" />
  <circle cx="120" cy="610" r="250" fill="#2b251d" opacity="0.035" />

  <text x="70" y="86" fill="#8a682c" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="4">CN PRINT · COPILOT SHARE</text>
  <text x="70" y="152" fill="#2b251d" font-family="Georgia, Noto Serif SC, serif" font-size="52" font-weight="700">三次升级，一条工作路径</text>
  <text x="70" y="196" fill="#675f54" font-family="Inter, Microsoft YaHei, sans-serif" font-size="22">任务说清 → 事实查准 → 方法复用</text>

  <path d="M190 430C340 320 475 500 620 400S865 320 1010 420" fill="none" stroke="url(#gold)" stroke-width="9" stroke-linecap="round" opacity="0.85" />

  <g filter="url(#shadow)" font-family="Inter, Microsoft YaHei, sans-serif" text-anchor="middle">
    <g transform="translate(190 430)">
      <circle r="76" fill="#fbf8f0" stroke="#b08a49" stroke-width="2" />
      <text y="-8" fill="#8a682c" font-size="17" font-weight="700">任务</text>
      <text y="28" fill="#2b251d" font-size="24" font-weight="800">说清楚</text>
    </g>
    <g transform="translate(620 400)">
      <circle r="76" fill="#fbf8f0" stroke="#b08a49" stroke-width="2" />
      <text y="-8" fill="#8a682c" font-size="17" font-weight="700">事实</text>
      <text y="28" fill="#2b251d" font-size="24" font-weight="800">查准确</text>
    </g>
    <g transform="translate(1010 420)">
      <circle r="76" fill="#fbf8f0" stroke="#b08a49" stroke-width="2" />
      <text y="-8" fill="#8a682c" font-size="17" font-weight="700">方法</text>
      <text y="28" fill="#2b251d" font-size="24" font-weight="800">可复用</text>
    </g>
  </g>

  <line x1="70" x2="1130" y1="590" y2="590" stroke="#2b251d" opacity="0.12" />
  <text x="70" y="628" fill="#675f54" font-family="Inter, Microsoft YaHei, sans-serif" font-size="19">同一个 Project Lighthouse 故事，贯穿 Chat、Microsoft 365 Copilot 与 Agent</text>
</svg>
