<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="Dino Blaster — a Minecraft-flavored FPS: gatling gun vs blocky dinosaurs">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8ecbf0"/><stop offset="1" stop-color="#c8e6f7"/></linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#sky)"/>

  <!-- clouds -->
  <g fill="#ffffff" opacity="0.9">
    <rect x="150" y="90" width="150" height="26" rx="4"/><rect x="196" y="66" width="80" height="26" rx="4"/>
    <rect x="820" y="120" width="180" height="28" rx="4"/><rect x="880" y="94" width="90" height="28" rx="4"/>
  </g>

  <!-- title -->
  <text x="80" y="120" font-family="'JetBrains Mono', monospace" font-size="52" font-weight="700" fill="#1c1a17">DINO BLASTER</text>
  <text x="82" y="160" font-family="'JetBrains Mono', monospace" font-size="20" fill="#1c1a17" fill-opacity="0.6">加特林 vs 恐龙 · Minecraft 风格 FPS · Fable 5 生成</text>

  <!-- voxel ground: two stepped rows -->
  <g>
    <rect x="0" y="560" width="1200" height="190" fill="#7a542f"/>
    <g fill="#5d9c3d">
      <rect x="0" y="560" width="1200" height="46"/>
    </g>
    <!-- block seams -->
    <g stroke="#4c8331" stroke-width="3" opacity="0.55">
      <line x1="100" y1="560" x2="100" y2="606"/><line x1="200" y1="560" x2="200" y2="606"/><line x1="300" y1="560" x2="300" y2="606"/><line x1="400" y1="560" x2="400" y2="606"/><line x1="500" y1="560" x2="500" y2="606"/><line x1="600" y1="560" x2="600" y2="606"/><line x1="700" y1="560" x2="700" y2="606"/><line x1="800" y1="560" x2="800" y2="606"/><line x1="900" y1="560" x2="900" y2="606"/><line x1="1000" y1="560" x2="1000" y2="606"/><line x1="1100" y1="560" x2="1100" y2="606"/>
    </g>
    <g stroke="#634426" stroke-width="3" opacity="0.5">
      <line x1="50" y1="606" x2="50" y2="750"/><line x1="150" y1="606" x2="150" y2="750"/><line x1="250" y1="606" x2="250" y2="750"/><line x1="350" y1="606" x2="350" y2="750"/><line x1="450" y1="606" x2="450" y2="750"/><line x1="550" y1="606" x2="550" y2="750"/><line x1="650" y1="606" x2="650" y2="750"/><line x1="750" y1="606" x2="750" y2="750"/><line x1="850" y1="606" x2="850" y2="750"/><line x1="950" y1="606" x2="950" y2="750"/><line x1="1050" y1="606" x2="1050" y2="750"/><line x1="1150" y1="606" x2="1150" y2="750"/>
      <line x1="0" y1="678" x2="1200" y2="678"/>
    </g>
  </g>

  <!-- tree -->
  <g>
    <rect x="150" y="470" width="34" height="90" fill="#6b4a2b"/>
    <rect x="108" y="392" width="120" height="92" fill="#2e7d32"/>
  </g>

  <!-- blocky T-rex -->
  <g>
    <rect x="700" y="380" width="180" height="110" fill="#5a8f3c"/>                     <!-- body -->
    <rect x="640" y="310" width="100" height="86" fill="#5a8f3c"/>                      <!-- head -->
    <rect x="612" y="368" width="88" height="30" fill="#4c7a32"/>                       <!-- jaw -->
    <rect x="660" y="332" width="18" height="18" fill="#151515"/>                       <!-- eye -->
    <g fill="#f6f3ec"><rect x="622" y="360" width="12" height="12"/><rect x="644" y="360" width="12" height="12"/><rect x="666" y="360" width="12" height="12"/></g> <!-- teeth -->
    <rect x="874" y="396" width="110" height="52" fill="#4c7a32"/>                      <!-- tail -->
    <rect x="978" y="404" width="70" height="34" fill="#5a8f3c"/>
    <rect x="722" y="488" width="46" height="72" fill="#4c7a32"/>                       <!-- legs -->
    <rect x="808" y="488" width="46" height="72" fill="#4c7a32"/>
    <rect x="700" y="430" width="26" height="34" fill="#4c7a32"/>                       <!-- arm -->
  </g>

  <!-- explosion behind a second dino -->
  <g>
    <g fill="#ffa94d"><rect x="1000" y="300" width="26" height="26"/><rect x="1040" y="268" width="20" height="20"/><rect x="1062" y="316" width="24" height="24"/><rect x="1018" y="342" width="18" height="18"/></g>
    <g fill="#ffd27a"><rect x="1030" y="296" width="22" height="22"/><rect x="1052" y="342" width="16" height="16"/><rect x="1006" y="262" width="16" height="16"/></g>
  </g>
  <!-- grenade mid-air with dotted arc -->
  <g>
    <g fill="#1c1a17" opacity="0.35"><rect x="560" y="330" width="8" height="8"/><rect x="620" y="296" width="8" height="8"/><rect x="686" y="272" width="8" height="8"/><rect x="756" y="262" width="8" height="8"/><rect x="828" y="268" width="8" height="8"/><rect x="898" y="286" width="8" height="8"/><rect x="962" y="312" width="8" height="8"/></g>
    <rect x="520" y="352" width="34" height="40" rx="4" fill="#2f4f2f"/>
    <rect x="530" y="340" width="16" height="10" fill="#c9a34a"/>
  </g>

  <!-- gatling viewmodel, bottom right -->
  <g>
    <rect x="880" y="620" width="240" height="90" rx="8" fill="#23262b"/>
    <g fill="#3b3f45">
      <rect x="760" y="628" width="130" height="16" rx="6"/>
      <rect x="760" y="652" width="130" height="16" rx="6"/>
      <rect x="760" y="676" width="130" height="16" rx="6"/>
    </g>
    <rect x="742" y="620" width="26" height="78" rx="6" fill="#2b2e33"/>
    <!-- muzzle flash -->
    <g fill="#ffd27a"><rect x="700" y="640" width="30" height="30"/><rect x="672" y="650" width="18" height="12"/><rect x="708" y="614" width="14" height="14"/><rect x="706" y="682" width="14" height="14"/></g>
  </g>

  <!-- crosshair -->
  <g stroke="#1c1a17" stroke-width="5" opacity="0.75">
    <line x1="600" y1="418" x2="600" y2="446"/><line x1="586" y1="432" x2="614" y2="432"/>
  </g>

  <text x="80" y="702" font-family="'JetBrains Mono', monospace" font-size="15" fill="#1c1a17" fill-opacity="0.55">按住开火让加特林转起来 · 手雷抛物线 + 范围伤害 · 零素材,纯 three.js,音效 WebAudio 合成</text>
</svg>
