<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="Farmer Crosses the River 3D game">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe3f2"/><stop offset="1" stop-color="#e7f3f0"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f8fc4"/><stop offset="1" stop-color="#2f7fb8"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="750" fill="url(#sky)"/>
  <circle cx="1010" cy="150" r="66" fill="#fff3c8"/>

  <!-- mountains -->
  <path d="M0 340 L180 200 L360 340 Z" fill="#8fb36a" opacity="0.7"/>
  <path d="M840 340 L1020 200 L1200 340 Z" fill="#8fb36a" opacity="0.7"/>

  <!-- banks -->
  <rect x="0" y="330" width="360" height="420" fill="#6fa84a"/>
  <rect x="840" y="330" width="360" height="420" fill="#6fa84a"/>
  <rect x="340" y="330" width="24" height="420" fill="#d9c48a"/>
  <rect x="836" y="330" width="24" height="420" fill="#d9c48a"/>
  <!-- river -->
  <rect x="364" y="330" width="472" height="420" fill="url(#water)"/>
  <g stroke="#bfe0f0" stroke-width="4" fill="none" opacity="0.6">
    <path d="M390 420 q30 -14 60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0"/>
    <path d="M390 500 q30 -14 60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0"/>
    <path d="M390 590 q30 -14 60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0"/>
  </g>

  <text x="70" y="140" font-family="'Cormorant Garamond', Georgia, serif" font-size="60" font-weight="600" fill="#1c1a17">农夫过河 · 3D</text>
  <text x="72" y="182" font-family="'JetBrains Mono', monospace" font-size="19" fill="#3a5a2c">狼羊菜加强版 · 最优 9 次渡河 · Three.js</text>

  <!-- left bank items -->
  <text x="120" y="470" font-size="66">🍎</text>
  <!-- boat mid-river with farmer + snake -->
  <g filter="url(#soft)">
    <path d="M470 560 q130 60 260 0 l-30 60 q-100 42 -200 0 Z" fill="#8a5a2b"/>
    <rect x="510" y="548" width="180" height="20" rx="10" fill="#5f3d1c"/>
  </g>
  <text x="540" y="545" font-size="60">👨‍🌾</text>
  <text x="620" y="560" font-size="46">🐍</text>

  <!-- far bank items -->
  <text x="900" y="440" font-size="60">🐯</text>
  <text x="1010" y="440" font-size="60">🐑</text>
  <text x="955" y="560" font-size="60">🐔</text>
  <text x="880" y="380" font-family="'JetBrains Mono', monospace" font-size="17" fill="#eef7ff">对岸</text>
  <text x="120" y="380" font-family="'JetBrains Mono', monospace" font-size="17" fill="#26231f">左岸</text>

  <text x="70" y="694" font-family="'JetBrains Mono', monospace" font-size="16" fill="#26231f">点动物上船 · 渡河 · 农夫不在时的连锁吃法 · 内置 BFS 提示与自动演示最优解</text>
</svg>
