<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="NotebookLM hand-drawn slide YAML">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f3ec"/><stop offset="1" stop-color="#ece6da"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>

  <text x="80" y="96" font-family="'JetBrains Mono', monospace" font-size="19" fill="#8a682c">NOTEBOOKLM · YAML 风格规格 → 手绘幻灯片</text>
  <text x="78" y="162" font-family="'Cormorant Garamond', Georgia, serif" font-size="56" font-weight="600" fill="#1c1a17">线画风幻灯片提示词</text>

  <!-- left: YAML spec -->
  <g filter="url(#soft)"><rect x="80" y="216" width="470" height="380" rx="16" fill="#26231f"/></g>
  <text x="104" y="252" font-family="'JetBrains Mono', monospace" font-size="13" fill="#c9a35c">style.yaml</text>
  <g font-family="'JetBrains Mono', monospace" font-size="15">
    <text x="104" y="290" fill="#8fb573">style:</text>
    <text x="124" y="316" fill="rgba(233,227,216,0.8)">aesthetic: <tspan fill="#c9a35c">line_art</tspan></text>
    <text x="124" y="342" fill="rgba(233,227,216,0.8)">line: thin, hand-drawn</text>
    <text x="124" y="368" fill="rgba(233,227,216,0.8)">fill: none</text>
    <text x="124" y="394" fill="rgba(233,227,216,0.8)">palette:</text>
    <text x="144" y="420" fill="rgba(233,227,216,0.8)">accent: <tspan fill="#6fa8dc">"#2f6fb0"</tspan></text>
    <text x="124" y="446" fill="rgba(233,227,216,0.8)">icons: one idea each</text>
    <text x="104" y="480" fill="#8fb573">rules:</text>
    <text x="124" y="506" fill="rgba(233,227,216,0.8)">- one message per slide</text>
    <text x="124" y="532" fill="rgba(233,227,216,0.8)">- one accent color</text>
    <text x="124" y="558" fill="rgba(233,227,216,0.8)">- generous white space</text>
  </g>

  <text x="588" y="410" font-family="'JetBrains Mono', monospace" font-size="34" fill="rgba(28,26,23,0.3)">→</text>

  <!-- right: line-art slide preview -->
  <g filter="url(#soft)"><rect x="650" y="216" width="470" height="264" rx="14" fill="#fbfaf6" stroke="rgba(28,26,23,0.1)"/></g>
  <text x="684" y="286" font-family="'Cormorant Garamond', Georgia, serif" font-size="52" font-weight="700" fill="#2f6fb0">01</text>
  <rect x="684" y="304" width="230" height="14" rx="7" fill="#33475b" opacity="0.85"/>
  <rect x="684" y="328" width="170" height="10" rx="5" fill="#33475b" opacity="0.35"/>
  <g fill="none" stroke="#33475b" stroke-width="2.5" stroke-linecap="round">
    <circle cx="716" cy="410" r="22"/>
    <rect x="812" y="388" width="44" height="44" rx="6"/>
    <path d="M956 432 l20 -34 20 34 z"/>
  </g>
  <path d="M666 470 C 780 452, 980 486, 1104 462" fill="none" stroke="#2f6fb0" stroke-width="2" opacity="0.5"/>

  <!-- four style dots -->
  <g font-family="'JetBrains Mono', monospace" font-size="15">
    <circle cx="672" cy="536" r="9" fill="#2f6fb0"/><text x="690" y="541" fill="rgba(28,26,23,0.7)">简约线画</text>
    <circle cx="800" cy="536" r="9" fill="#7c5cbf"/><text x="818" y="541" fill="rgba(28,26,23,0.7)">蜡笔涂鸦</text>
    <circle cx="928" cy="536" r="9" fill="#e8863c"/><text x="946" y="541" fill="rgba(28,26,23,0.7)">暖橙线画</text>
    <circle cx="1052" cy="536" r="9" fill="#2b7cc0"/><text x="1070" y="541" fill="rgba(28,26,23,0.7)">信息图</text>
  </g>

  <text x="80" y="682" font-family="'JetBrains Mono', monospace" font-size="17" fill="#1c1a17" fill-opacity="0.55">技法署名 しらき@パワポ図解 · 双语 · YAML 一键复制 · 四种风格可切换</text>
