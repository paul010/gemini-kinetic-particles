<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="Perler Beads Workshop 3D">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f3ec"/><stop offset="1" stop-color="#ece6da"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>

  <text x="80" y="100" font-family="'JetBrains Mono', monospace" font-size="19" fill="#8a682c">3D PERLER BEADS · 在线拼豆游戏</text>
  <text x="78" y="166" font-family="'Cormorant Garamond', Georgia, serif" font-size="56" font-weight="600" fill="#1c1a17">🧩 拼豆工坊</text>

  <!-- pegboard with beads forming a heart, in slight 3D skew -->
  <g filter="url(#soft)" transform="translate(690 250) skewX(-8)">
    <rect x="0" y="0" width="430" height="430" rx="14" fill="#fffdf8" stroke="rgba(28,26,23,0.12)"/>
  </g>
  <g transform="translate(690 250) skewX(-8)">
    <!-- peg dots grid (faint) -->
    <g fill="rgba(28,26,23,0.08)">
      <!-- generated 10x10 pegs -->
      <!-- rows -->
      <!-- to keep compact, draw a light grid via lines -->
    </g>
  </g>
  <!-- heart made of round beads -->
  <g transform="translate(690 250) skewX(-8)">
    <g>
      <!-- heart bead layout on a ~10 col grid, cell 40, start 25 -->
      <!-- row2 -->
      <circle cx="105" cy="105" r="16" fill="#e0556b"/><circle cx="145" cy="105" r="16" fill="#e0556b"/>
      <circle cx="265" cy="105" r="16" fill="#e0556b"/><circle cx="305" cy="105" r="16" fill="#e0556b"/>
      <!-- row3 -->
      <circle cx="65" cy="145" r="16" fill="#e0556b"/><circle cx="105" cy="145" r="16" fill="#f2a1ad"/><circle cx="145" cy="145" r="16" fill="#e0556b"/><circle cx="185" cy="145" r="16" fill="#e0556b"/>
      <circle cx="225" cy="145" r="16" fill="#e0556b"/><circle cx="265" cy="145" r="16" fill="#e0556b"/><circle cx="305" cy="145" r="16" fill="#f2a1ad"/><circle cx="345" cy="145" r="16" fill="#e0556b"/>
      <!-- row4 -->
      <circle cx="65" cy="185" r="16" fill="#e0556b"/><circle cx="105" cy="185" r="16" fill="#e0556b"/><circle cx="145" cy="185" r="16" fill="#e0556b"/><circle cx="185" cy="185" r="16" fill="#e0556b"/>
      <circle cx="225" cy="185" r="16" fill="#e0556b"/><circle cx="265" cy="185" r="16" fill="#e0556b"/><circle cx="305" cy="185" r="16" fill="#e0556b"/><circle cx="345" cy="185" r="16" fill="#e0556b"/>
      <!-- row5 -->
      <circle cx="105" cy="225" r="16" fill="#e0556b"/><circle cx="145" cy="225" r="16" fill="#e0556b"/><circle cx="185" cy="225" r="16" fill="#e0556b"/><circle cx="225" cy="225" r="16" fill="#e0556b"/><circle cx="265" cy="225" r="16" fill="#e0556b"/><circle cx="305" cy="225" r="16" fill="#e0556b"/>
      <!-- row6 -->
      <circle cx="145" cy="265" r="16" fill="#e0556b"/><circle cx="185" cy="265" r="16" fill="#e0556b"/><circle cx="225" cy="265" r="16" fill="#e0556b"/><circle cx="265" cy="265" r="16" fill="#e0556b"/>
      <!-- row7 -->
      <circle cx="185" cy="305" r="16" fill="#e0556b"/><circle cx="225" cy="305" r="16" fill="#e0556b"/>
    </g>
  </g>

  <!-- palette dots -->
  <g>
    <circle cx="110" cy="300" r="22" fill="#e0556b"/><circle cx="110" cy="360" r="22" fill="#2f6fb0"/>
    <circle cx="110" cy="420" r="22" fill="#5c8a3a"/><circle cx="110" cy="480" r="22" fill="#e8a93c"/>
    <circle cx="110" cy="540" r="22" fill="#7a5cab"/>
  </g>
  <text x="170" y="360" font-family="'JetBrains Mono', monospace" font-size="18" fill="rgba(28,26,23,0.7)">自由创作 / 模板 / 图片转像素</text>
  <text x="170" y="420" font-family="'JetBrains Mono', monospace" font-size="18" fill="rgba(28,26,23,0.7)">AI 设计 · 4 位设计师替你拼</text>
  <text x="170" y="480" font-family="'JetBrains Mono', monospace" font-size="18" fill="rgba(28,26,23,0.7)">拼完烫一烫 · 和作品合影</text>

  <text x="80" y="694" font-family="'JetBrains Mono', monospace" font-size="16" fill="#8a682c">方形 14–40 · 圆形 · 爱心 · 3D 旋转缩放 · 一键分享 X / LinkedIn</text>
</svg>
