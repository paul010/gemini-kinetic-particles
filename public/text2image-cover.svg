<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="Text-to-Image Prompt Studio">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f3ec"/><stop offset="1" stop-color="#efe7db"/>
    </linearGradient>
    <linearGradient id="img" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c2703c"/><stop offset="0.5" stop-color="#e8a93c"/><stop offset="1" stop-color="#2f6fb0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>

  <text x="80" y="104" font-family="'JetBrains Mono', monospace" font-size="19" fill="#8a682c">WORKSHOP · 文生图提示词</text>
  <text x="78" y="176" font-family="'Cormorant Garamond', Georgia, serif" font-size="58" font-weight="600" fill="#1c1a17">文生图提示词工坊</text>

  <!-- left: prompt block with color-coded chips -->
  <g filter="url(#soft)"><rect x="80" y="250" width="470" height="360" rx="16" fill="#fffdf8" stroke="rgba(28,26,23,0.08)"/></g>
  <text x="108" y="292" font-family="'JetBrains Mono', monospace" font-size="15" fill="#8a682c">PROMPT · 七模块</text>
  <g font-family="'JetBrains Mono', monospace" font-size="16">
    <g><rect x="108" y="312" width="150" height="30" rx="7" fill="#2f6fb022"/><text x="122" y="333" fill="#2f6fb0">主体</text></g>
    <g><rect x="270" y="312" width="180" height="30" rx="7" fill="#5c8a3a22"/><text x="284" y="333" fill="#5c8a3a">场景环境</text></g>
    <g><rect x="108" y="352" width="130" height="30" rx="7" fill="#c2703c22"/><text x="122" y="373" fill="#c2703c">风格</text></g>
    <g><rect x="250" y="352" width="180" height="30" rx="7" fill="#7a5cab22"/><text x="264" y="373" fill="#7a5cab">构图镜头</text></g>
    <g><rect x="108" y="392" width="130" height="30" rx="7" fill="#b8860b22"/><text x="122" y="413" fill="#b8860b">光线</text></g>
    <g><rect x="250" y="392" width="150" height="30" rx="7" fill="#2b8a8a22"/><text x="264" y="413" fill="#2b8a8a">画质</text></g>
    <g><rect x="108" y="432" width="180" height="30" rx="7" fill="#8a682c22"/><text x="122" y="453" fill="#8a682c">--ar 3:2</text></g>
  </g>
  <line x1="108" y1="494" x2="522" y2="494" stroke="rgba(28,26,23,0.1)"/>
  <text x="108" y="528" font-family="'JetBrains Mono', monospace" font-size="14" fill="rgba(28,26,23,0.55)">主体 → 场景 → 风格 → 镜头 →</text>
  <text x="108" y="552" font-family="'JetBrains Mono', monospace" font-size="14" fill="rgba(28,26,23,0.55)">光线 → 画质 → 参数</text>
  <text x="108" y="586" font-family="'JetBrains Mono', monospace" font-size="14" fill="#8a682c">场景模板 · 风格锁 · 修饰词速查</text>

  <!-- arrow -->
  <g stroke="#8a682c" stroke-width="3" fill="none">
    <line x1="580" y1="430" x2="650" y2="430"/>
    <path d="M638 418 L652 430 L638 442"/>
  </g>

  <!-- right: generated image frame -->
  <g filter="url(#soft)"><rect x="680" y="250" width="440" height="360" rx="16" fill="#fff" stroke="rgba(28,26,23,0.08)"/></g>
  <rect x="700" y="270" width="400" height="300" rx="10" fill="url(#img)"/>
  <!-- abstract subject: barista silhouette + cup -->
  <g opacity="0.9">
    <circle cx="900" cy="380" r="42" fill="#fffdf8" opacity="0.85"/>
    <rect x="852" y="430" width="96" height="90" rx="20" fill="#fffdf8" opacity="0.85"/>
    <ellipse cx="900" cy="536" rx="60" ry="12" fill="#1c1a17" opacity="0.15"/>
  </g>
  <text x="720" y="600" font-family="'JetBrains Mono', monospace" font-size="14" fill="rgba(28,26,23,0.5)">一致的平台级视觉 · 批量出图</text>

  <text x="80" y="694" font-family="'JetBrains Mono', monospace" font-size="15" fill="#8a682c">交互搭建器 · 中英双语提示词 · 通用于 Midjourney / 即梦 / 豆包 / Nano Banana / DALL·E</text>
</svg>
