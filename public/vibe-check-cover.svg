<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">隐藏气质测试封面</title><desc id="desc">粉紫渐变背景上的娱乐人格卡片</desc>
  <defs><linearGradient id="bg" x1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset=".48" stop-color="#faeffa"/><stop offset="1" stop-color="#e9e1ff"/></linearGradient><linearGradient id="accent" x1="0" x2="1"><stop stop-color="#e64b9a"/><stop offset="1" stop-color="#7457df"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#684393" flood-opacity=".18"/></filter></defs>
  <rect width="1200" height="720" fill="url(#bg)"/><circle cx="1090" cy="90" r="230" fill="#b79cff" opacity=".18"/><circle cx="70" cy="670" r="240" fill="#ff8fc8" opacity=".13"/>
  <g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="88" y="132" fill="#a54a92" font-size="24" font-weight="700" letter-spacing="5">纯娱乐 · VIBE CHECK</text><text x="88" y="248" fill="#191526" font-size="84" font-weight="900">你的隐藏</text><text x="88" y="348" fill="url(#accent)" font-size="96" font-weight="900">气质是什么？</text><text x="92" y="416" fill="#746a80" font-size="25">六道小题，生成专属于你的娱乐人格卡</text></g>
  <g transform="translate(760 135) rotate(4 175 220)" filter="url(#shadow)"><rect width="350" height="440" rx="38" fill="#fff" fill-opacity=".78" stroke="#fff" stroke-width="3"/><rect x="34" y="38" width="116" height="34" rx="17" fill="#f5e5f7"/><text x="52" y="61" fill="#b14799" font-size="16" font-family="sans-serif" font-weight="700">娱乐人格</text><text x="34" y="146" fill="#8c70dc" font-size="64">✦</text><text x="34" y="214" fill="#21192c" font-size="37" font-family="sans-serif" font-weight="800">等待揭晓</text><text x="34" y="252" fill="#8b8195" font-size="15" font-family="sans-serif">答案没有对错</text><circle cx="275" cy="332" r="52" fill="none" stroke="#eee4f3" stroke-width="13"/><path d="M275 280a52 52 0 1 1-45 78" fill="none" stroke="url(#accent)" stroke-width="13" stroke-linecap="round"/><text x="260" y="345" fill="#cf4e9a" font-size="39" font-family="sans-serif" font-weight="800">?</text></g>
